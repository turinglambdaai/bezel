name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BEZEL_QT_VERSION: '6.8.3'

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release metadata and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Verify repository versions
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: racket scripts/check-version.rkt

      - name: Verify tag matches repository version
        if: startsWith(github.ref, 'refs/tags/v')
        run: racket scripts/check-version.rkt "$GITHUB_REF_NAME"

      - name: Verify fail-closed license policy
        run: python3 scripts/check-license-policy.py

  redistribution-policy:
    name: Verify public Qt redistribution approval
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Manual validation mode
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Manual release validation builds LGPL test artifacts but does not publish binaries."

      - name: Gate tagged Qt redistribution
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          LICENSE_MODE: ${{ vars.BEZEL_QT_LICENSE_MODE }}
          REDISTRIBUTION_ACK: ${{ vars.BEZEL_QT_REDISTRIBUTION_ACK }}
        run: |
          set -euo pipefail
          if [[ "$LICENSE_MODE" != "lgpl" ]]; then
            echo "The public Bezel release workflow is intentionally LGPL-only." >&2
            echo "It builds from public Qt artifacts and cannot establish private commercial Qt entitlement or provenance." >&2
            echo "Commercial-Qt releases must use a separate private pipeline backed by the licensed Qt distribution." >&2
            exit 1
          fi
          if [[ "$REDISTRIBUTION_ACK" != "approved-lgpl-v3" ]]; then
            echo "Set BEZEL_QT_REDISTRIBUTION_ACK=approved-lgpl-v3 only after reviewing the exact tagged LGPL distribution." >&2
            exit 1
          fi
          echo "Public Qt redistribution mode: LGPLv3, dynamic linking, pinned Qt $BEZEL_QT_VERSION."

  compliance:
    name: Build verified license/source bundle
    needs: [metadata, redistribution-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate Qt license material and verified corresponding source
        run: python3 scripts/prepare-qt-compliance.py --out-dir dist/compliance

      - name: Verify pinned source archive digest
        run: |
          echo "56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80  dist/compliance/source/qtbase-everywhere-src-6.8.3.tar.xz" | sha256sum --check -

      - name: Upload compliance inputs
        uses: actions/upload-artifact@v4
        with:
          name: qt-compliance
          path: dist/compliance
          if-no-files-found: error

  native:
    name: Build release package (${{ matrix.platform }})
    needs: [metadata, redistribution-policy, compliance]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: bezel-native-linux-x86_64
            archive: bezel-native-linux-x86_64.tar.gz
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            asset: bezel-native-windows-x86_64
            archive: bezel-native-windows-x86_64.zip
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            asset: bezel-native-macosx-aarch64
            archive: bezel-native-macosx-aarch64.tar.gz
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Download verified compliance material
        uses: actions/download-artifact@v4
        with:
          name: qt-compliance
          path: dist/compliance

      - name: Install Racket for package assembly
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Install Linux source-build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build python3 curl patchelf \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-cursor-dev \
            libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libdbus-1-dev

      - name: Restore pinned Linux Qt build cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .qt-linux/6.8.3
          key: bezel-qt-linux-6.8.3-noicu-bundled-56001b905601bb90-v1

      - name: Build exact QtBase source (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-pinned-qt-linux.sh "$GITHUB_WORKSPACE/.qt-linux/6.8.3" "$GITHUB_WORKSPACE/.qt-linux-build" "$GITHUB_WORKSPACE/dist/compliance/source/qtbase-everywhere-src-6.8.3.tar.xz"

      - name: Export pinned Linux Qt
        if: runner.os == 'Linux'
        run: |
          echo "$GITHUB_WORKSPACE/.qt-linux/6.8.3/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.qt-linux/6.8.3" >> "$GITHUB_ENV"
          echo "QT_ROOT_DIR=$GITHUB_WORKSPACE/.qt-linux/6.8.3" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$GITHUB_WORKSPACE/.qt-linux/6.8.3/plugins" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.qt-linux/6.8.3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install exact QtBase (Windows/macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.BEZEL_QT_VERSION }}
          archives: qtbase
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/package-native-linux.sh bezel-shim/build dist dist/compliance/runtime-licenses

      - name: Package macOS runtime
        if: runner.os == 'macOS'
        run: bash scripts/package-native-macos.sh bezel-shim/build dist dist/compliance/runtime-licenses

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native-windows.ps1 -BuildDir bezel-shim/build -DistDir dist -ComplianceDir dist/compliance/runtime-licenses

      - name: Build self-contained Racket package
        run: racket scripts/package-racket-runtime.rkt "dist/${{ matrix.asset }}" "${{ matrix.platform }}" dist

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/${{ matrix.archive }}
            dist/bezel-lib-${{ matrix.platform }}.zip
            dist/bezel-lib-${{ matrix.platform }}.zip.CHECKSUM
          if-no-files-found: error

  smoke:
    name: Verify release package (${{ matrix.target }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64-ubuntu22
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: ubuntu-24.04
            target: linux-x86_64-ubuntu24
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            target: windows-x86_64
            asset: bezel-native-windows-x86_64
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            target: macosx-aarch64
            asset: bezel-native-macosx-aarch64
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket only
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist

      - name: Install self-contained Bezel package
        run: raco pkg install --auto --no-docs --name bezel-lib "dist/bezel-lib-${{ matrix.platform }}.zip"

      - name: Diagnose package-local runtime
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: raco bezel doctor

      - name: Run packaged runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: racket scripts/native-smoke.rkt

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, compliance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all verified release inputs
        uses: actions/download-artifact@v4
        with:
          pattern: release-bezel-native-*
          path: dist
          merge-multiple: true

      - name: Download exact corresponding source
        uses: actions/download-artifact@v4
        with:
          name: qt-compliance
          path: dist/compliance

      - name: Stage verified QtBase source
        run: cp dist/compliance/source/qtbase-everywhere-src-6.8.3.tar.xz dist/

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum bezel-native-* bezel-lib-*.zip qtbase-everywhere-src-6.8.3.tar.xz > SHA256SUMS
          grep 'qtbase-everywhere-src-6.8.3.tar.xz' SHA256SUMS | grep '^56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80 ' >/dev/null
          cat SHA256SUMS

      - name: Record redistribution mode
        run: |
          {
            echo "Bezel release: $GITHUB_REF_NAME"
            echo "Qt redistribution mode: LGPLv3"
            echo "Qt version: $BEZEL_QT_VERSION"
            echo "Linkage: dynamic"
            echo "Linux Qt build: exact source, shared, ICU disabled, bundled QtBase third-party libraries"
            echo "QtBase source asset: qtbase-everywhere-src-6.8.3.tar.xz"
            echo "QtBase source SHA-256: 56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80"
            echo "Public workflow commercial-Qt publication: prohibited"
            echo "See docs/COMMERCIAL_RELEASE.md and docs/LGPL_RELINKING.md in the tagged source."
          } > dist/QT-REDISTRIBUTION.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bezel-native-* \
            dist/bezel-lib-*.zip \
            dist/bezel-lib-*.zip.CHECKSUM \
            dist/qtbase-everywhere-src-6.8.3.tar.xz \
            dist/SHA256SUMS \
            dist/QT-REDISTRIBUTION.txt \
            --verify-tag \
            --generate-notes \
            --title "Bezel $GITHUB_REF_NAME"

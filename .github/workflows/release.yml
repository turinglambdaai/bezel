name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Verify repository versions
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: racket scripts/check-version.rkt

      - name: Verify tag matches repository version
        if: startsWith(github.ref, 'refs/tags/v')
        run: racket scripts/check-version.rkt "$GITHUB_REF_NAME"

  redistribution-policy:
    name: Verify Qt redistribution approval
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Manual validation mode
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Manual release validation does not publish Qt binaries."

      - name: Gate tagged Qt redistribution
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          LICENSE_MODE: ${{ vars.BEZEL_QT_LICENSE_MODE }}
          REDISTRIBUTION_ACK: ${{ vars.BEZEL_QT_REDISTRIBUTION_ACK }}
          SOURCE_OFFER_URL: ${{ vars.BEZEL_QT_SOURCE_OFFER_URL }}
        run: |
          set -euo pipefail
          if [[ "$REDISTRIBUTION_ACK" != "approved" ]]; then
            echo "Tagged releases redistribute Qt runtime binaries." >&2
            echo "Set repository variable BEZEL_QT_REDISTRIBUTION_ACK=approved only after the distribution rights and obligations for the exact Qt build have been reviewed." >&2
            exit 1
          fi

          case "$LICENSE_MODE" in
            commercial)
              echo "Qt redistribution mode: commercial (repository owner acknowledgement)."
              ;;
            lgpl)
              if [[ -z "$SOURCE_OFFER_URL" ]]; then
                echo "LGPL redistribution requires BEZEL_QT_SOURCE_OFFER_URL to point to the distributor-controlled corresponding-source/source-offer location for the exact Qt build." >&2
                exit 1
              fi
              echo "Qt redistribution mode: LGPL; source/source-offer location configured."
              ;;
            *)
              echo "Set BEZEL_QT_LICENSE_MODE to either 'commercial' or 'lgpl'." >&2
              exit 1
              ;;
          esac

  native:
    name: Build release package (${{ matrix.platform }})
    needs: [metadata, redistribution-policy]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: bezel-native-linux-x86_64
            archive: bezel-native-linux-x86_64.tar.gz
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            asset: bezel-native-windows-x86_64
            archive: bezel-native-windows-x86_64.zip
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            asset: bezel-native-macosx-aarch64
            archive: bezel-native-macosx-aarch64.tar.gz
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket for package assembly
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Install Qt6 and packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev patchelf
          echo "CMAKE_PREFIX_PATH=/usr" >> $GITHUB_ENV

      - name: Install Qt6 and packaging tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt cmake
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          archives: qtbase
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/package-native-linux.sh bezel-shim/build dist

      - name: Package macOS runtime
        if: runner.os == 'macOS'
        run: bash scripts/package-native-macos.sh bezel-shim/build dist

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native-windows.ps1 -BuildDir bezel-shim/build -DistDir dist

      - name: Build self-contained Racket package
        run: racket scripts/package-racket-runtime.rkt "dist/${{ matrix.asset }}" "${{ matrix.platform }}" dist

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/${{ matrix.archive }}
            dist/bezel-lib-${{ matrix.platform }}.zip
            dist/bezel-lib-${{ matrix.platform }}.zip.CHECKSUM
          if-no-files-found: error

  smoke:
    name: Verify release package (${{ matrix.target }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64-ubuntu22
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: ubuntu-24.04
            target: linux-x86_64-ubuntu24
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            target: windows-x86_64
            asset: bezel-native-windows-x86_64
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            target: macosx-aarch64
            asset: bezel-native-macosx-aarch64
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket only
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist

      - name: Install self-contained Bezel package
        run: raco pkg install --auto --no-docs --name bezel-lib "dist/bezel-lib-${{ matrix.platform }}.zip"

      - name: Diagnose package-local runtime
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: raco bezel doctor

      - name: Run packaged runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: racket scripts/native-smoke.rkt

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all verified release inputs
        uses: actions/download-artifact@v4
        with:
          pattern: release-bezel-native-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum bezel-native-* bezel-lib-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Record redistribution mode
        env:
          LICENSE_MODE: ${{ vars.BEZEL_QT_LICENSE_MODE }}
          SOURCE_OFFER_URL: ${{ vars.BEZEL_QT_SOURCE_OFFER_URL }}
        run: |
          {
            echo "Bezel release: $GITHUB_REF_NAME"
            echo "Qt redistribution mode: $LICENSE_MODE"
            if [[ "$LICENSE_MODE" == "lgpl" ]]; then
              echo "Distributor-controlled Qt source/source-offer location: $SOURCE_OFFER_URL"
            fi
            echo "See docs/COMMERCIAL_RELEASE.md in the tagged source for release obligations and limitations."
          } > dist/QT-REDISTRIBUTION.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bezel-native-* \
            dist/bezel-lib-*.zip \
            dist/bezel-lib-*.zip.CHECKSUM \
            dist/SHA256SUMS \
            dist/QT-REDISTRIBUTION.txt \
            --verify-tag \
            --generate-notes \
            --title "Bezel $GITHUB_REF_NAME"

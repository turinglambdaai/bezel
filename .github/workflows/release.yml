name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Verify repository versions
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: racket scripts/check-version.rkt

      - name: Verify tag matches repository version
        if: startsWith(github.ref, 'refs/tags/v')
        run: racket scripts/check-version.rkt "$GITHUB_REF_NAME"

  native:
    name: Build native runtime (${{ matrix.asset }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bezel-native-linux-x86_64
            archive: bezel-native-linux-x86_64.tar.gz
          - os: windows-latest
            asset: bezel-native-windows-x86_64
            archive: bezel-native-windows-x86_64.zip
          - os: macOS-latest
            asset: bezel-native-macosx-aarch64
            archive: bezel-native-macosx-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev patchelf
          echo "CMAKE_PREFIX_PATH=/usr" >> $GITHUB_ENV

      - name: Install Qt6 and packaging tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt cmake
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          archives: qtbase
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/package-native-linux.sh bezel-shim/build dist

      - name: Package macOS runtime
        if: runner.os == 'macOS'
        run: bash scripts/package-native-macos.sh bezel-shim/build dist

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native-windows.ps1 -BuildDir bezel-shim/build -DistDir dist

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  smoke:
    name: Verify release runtime (${{ matrix.asset }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bezel-native-linux-x86_64
            archive: bezel-native-linux-x86_64.tar.gz
            racket-arch: x64
          - os: windows-latest
            asset: bezel-native-windows-x86_64
            archive: bezel-native-windows-x86_64.zip
            racket-arch: x64
          - os: macOS-latest
            asset: bezel-native-macosx-aarch64
            archive: bezel-native-macosx-aarch64.tar.gz
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket only
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Download runtime archive
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist

      - name: Extract runtime (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/unpacked
          tar -xzf "dist/${{ matrix.archive }}" -C dist/unpacked

      - name: Extract runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "dist/${{ matrix.archive }}" -DestinationPath "dist/unpacked" -Force

      - name: Link Racket packages
        run: |
          raco pkg install --auto --no-docs --link ./bezel-lib
          raco pkg install --auto --no-docs --link ./bezel

      - name: Diagnose packaged runtime
        env:
          BEZEL_NATIVE_DIR: ${{ github.workspace }}/dist/unpacked/${{ matrix.asset }}
          QT_QPA_PLATFORM: offscreen
        run: raco bezel doctor

      - name: Run packaged runtime smoke test
        env:
          BEZEL_NATIVE_DIR: ${{ github.workspace }}/dist/unpacked/${{ matrix.asset }}
          QT_QPA_PLATFORM: offscreen
        run: racket scripts/native-smoke.rkt

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all verified runtime archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-bezel-native-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum bezel-native-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bezel-native-* \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Bezel $GITHUB_REF_NAME"

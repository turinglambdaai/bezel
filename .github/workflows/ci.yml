name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BEZEL_QT_VERSION: '6.8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Verify version consistency
        run: racket scripts/check-version.rkt

      - name: Verify fail-closed license policy
        run: python3 scripts/check-license-policy.py

      - name: Regenerate checked-in bindings
        run: racket tools/generator/generate.rkt tools/generator/specs/dial.json

      - name: Verify generated bindings are reproducible
        run: git diff --exit-code -- bezel-shim/src/generated bezel-lib/generated

  compliance:
    name: Verify Qt licenses and source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate license bundle from exact QtBase source
        run: python3 scripts/prepare-qt-compliance.py --out-dir dist/compliance

      - name: Verify exact corresponding-source digest
        run: |
          echo "532dfbf3fa3cbc68fa37441ea9e81c5009da044eaecda78ffaeafd8bd125532f  dist/compliance/source/qtbase-everywhere-opensource-src-6.8.4.tar.xz" | sha256sum --check -
          echo "86c063884e0a274075f29d1aa452001cef7d7dfcee21b21eb9a7165679b4052a  dist/compliance/source/patches/CVE-2026-19248-qtbase-6.8.diff" | sha256sum --check -
          echo "19683125f596b5278ff38461951ab778b1cc24a59065cc0721ff1a52e625f0c8  dist/compliance/source/patches/CVE-2026-76151-qtbase-6.8.diff" | sha256sum --check -
          echo "8a4f44fa40d4b46d0d2582652d84598f2ac55fcd4a53ecebc23ae5e381a3252a  dist/compliance/source/patches/CVE-2026-78253-qtbase-6.8.diff" | sha256sum --check -
          test -s dist/compliance/runtime-licenses/NOTICE.md
          test -s dist/compliance/runtime-licenses/RELINKING.md
          test -s dist/compliance/runtime-licenses/Qt/QTBASE-THIRD-PARTY-NOTICES.md
          test -s dist/compliance/runtime-licenses/Qt/LICENSES/LGPL-3.0-only.txt

      - name: Upload verified source and licensing material
        uses: actions/upload-artifact@v4
        with:
          name: qt-compliance
          path: dist/compliance
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        racket-version: ['8.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: ${{ matrix.racket-version }}
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}

      - name: Install Linux test Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev qt6-base-dev qt6-base-dev-tools

      - name: Install exact QtBase (Windows/macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.BEZEL_QT_VERSION }}
          archives: qtbase
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Link Racket packages
        run: |
          raco pkg install --auto --no-docs --link ./bezel-lib
          raco pkg install --auto --no-docs --link ./bezel-test
          raco pkg install --auto --no-docs --link ./bezel

      - name: Shim diagnostics (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -la bezel-shim/build/
          otool -L bezel-shim/build/libbezel*.dylib || true

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_TEST_PROGRESS: '1'
          BEZEL_MARSHAL_DEBUG: '1'
        timeout-minutes: 8
        run: raco test bezel-test/

      - name: Generate showcase screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: racket scripts/showcase.rkt docs/showcase.png

      - name: Upload showcase artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ matrix.os }}
          path: docs/showcase.png

  native-package:
    name: Native package (${{ matrix.asset }})
    needs: compliance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: bezel-native-linux-x86_64
            archive: bezel-native-linux-x86_64.tar.gz
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            asset: bezel-native-windows-x86_64
            archive: bezel-native-windows-x86_64.zip
            platform: windows-x86_64
            racket-arch: x64
          - os: macos-15
            asset: bezel-native-macosx-aarch64
            archive: bezel-native-macosx-aarch64.tar.gz
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Download verified source and licensing material
        uses: actions/download-artifact@v4
        with:
          name: qt-compliance
          path: dist/compliance

      - name: Set up Python for verified source preparation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Racket for package assembly
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Install Linux source-build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build python3 curl patchelf \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-cursor-dev \
            libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libdbus-1-dev

      - name: Restore pinned Linux Qt build cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .qt-linux/6.8.4
          key: bezel-qt-linux-6.8.4-noicu-sec-532dfbf3-86c06388-19683125-8a4f44fa-v1

      - name: Build exact QtBase from verified source (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-pinned-qt-linux.sh "$GITHUB_WORKSPACE/.qt-linux/6.8.4" "$GITHUB_WORKSPACE/.qt-linux-build" "$GITHUB_WORKSPACE/dist/compliance/source/qtbase-everywhere-opensource-src-6.8.4.tar.xz" "$GITHUB_WORKSPACE/dist/compliance/source/patches"

      - name: Export pinned Linux Qt
        if: runner.os == 'Linux'
        run: |
          echo "$GITHUB_WORKSPACE/.qt-linux/6.8.4/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.qt-linux/6.8.4" >> "$GITHUB_ENV"
          echo "QT_ROOT_DIR=$GITHUB_WORKSPACE/.qt-linux/6.8.4" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$GITHUB_WORKSPACE/.qt-linux/6.8.4/plugins" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.qt-linux/6.8.4/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Restore pinned Windows Qt build cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .qt-windows/6.8.4
          key: bezel-qt-windows-6.8.4-noicu-sec-532dfbf3-86c06388-19683125-8a4f44fa-v1

      - name: Restore pinned macOS Qt build cache
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .qt-macos/6.8.4
          key: bezel-qt-macos-6.8.4-noicu-noopengl-sec-532dfbf3-86c06388-19683125-8a4f44fa-v1

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build exact patched QtBase source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-pinned-qt-windows.ps1 -Prefix .qt-windows/6.8.4 -SourceArchive dist/compliance/source/qtbase-everywhere-opensource-src-6.8.4.tar.xz -PatchDir dist/compliance/source/patches

      - name: Export pinned Windows Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\.qt-windows\6.8.4\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE\.qt-windows\6.8.4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_ROOT_DIR=$env:GITHUB_WORKSPACE\.qt-windows\6.8.4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_PLUGIN_PATH=$env:GITHUB_WORKSPACE\.qt-windows\6.8.4\plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact patched QtBase source (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-pinned-qt-macos.sh "$GITHUB_WORKSPACE/.qt-macos/6.8.4" "$GITHUB_WORKSPACE/.qt-macos-build" "$GITHUB_WORKSPACE/dist/compliance/source/qtbase-everywhere-opensource-src-6.8.4.tar.xz" "$GITHUB_WORKSPACE/dist/compliance/source/patches"

      - name: Export pinned macOS Qt
        if: runner.os == 'macOS'
        run: |
          echo "$GITHUB_WORKSPACE/.qt-macos/6.8.4/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.qt-macos/6.8.4" >> "$GITHUB_ENV"
          echo "QT_ROOT_DIR=$GITHUB_WORKSPACE/.qt-macos/6.8.4" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$GITHUB_WORKSPACE/.qt-macos/6.8.4/plugins" >> "$GITHUB_ENV"

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/package-native-linux.sh bezel-shim/build dist dist/compliance/runtime-licenses

      - name: Package macOS runtime
        if: runner.os == 'macOS'
        run: bash scripts/package-native-macos.sh bezel-shim/build dist dist/compliance/runtime-licenses

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native-windows.ps1 -BuildDir bezel-shim/build -DistDir dist -ComplianceDir dist/compliance/runtime-licenses

      - name: Build self-contained Racket package
        run: racket scripts/package-racket-runtime.rkt "dist/${{ matrix.asset }}" "${{ matrix.platform }}" dist

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.archive }}
            dist/bezel-lib-${{ matrix.platform }}.zip
            dist/bezel-lib-${{ matrix.platform }}.zip.CHECKSUM
          if-no-files-found: error

  native-smoke:
    name: Clean package smoke (${{ matrix.target }})
    needs: native-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64-ubuntu22
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: ubuntu-24.04
            target: linux-x86_64-ubuntu24
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            target: windows-x86_64
            asset: bezel-native-windows-x86_64
            platform: windows-x86_64
            racket-arch: x64
          - os: macos-15
            target: macosx-aarch64
            asset: bezel-native-macosx-aarch64
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket only
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Install self-contained Bezel package
        run: raco pkg install --auto --no-docs --name bezel-lib "dist/bezel-lib-${{ matrix.platform }}.zip"

      - name: Diagnose package-local runtime
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: raco bezel doctor

      - name: Run packaged runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: racket scripts/native-smoke.rkt

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Link packages
        run: |
          raco pkg install --auto --no-docs --link ./bezel-lib
          raco pkg install --auto --no-docs --link ./bezel-doc

      - name: Build documentation
        run: raco setup bezel-doc

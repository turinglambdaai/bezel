name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Verify version consistency
        run: racket scripts/check-version.rkt

      - name: Regenerate checked-in bindings
        run: racket tools/generator/generate.rkt tools/generator/specs/dial.json

      - name: Verify generated bindings are reproducible
        run: git diff --exit-code -- bezel-shim/src/generated bezel-lib/generated

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        racket-version: ['8.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: ${{ matrix.racket-version }}
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev
          echo "CMAKE_PREFIX_PATH=/usr" >> $GITHUB_ENV

      - name: Install Qt6 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt cmake
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          archives: qtbase
          cache: true

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Link Racket packages
        run: |
          raco pkg install --auto --no-docs --link ./bezel-lib
          raco pkg install --auto --no-docs --link ./bezel-test
          raco pkg install --auto --no-docs --link ./bezel

      - name: Shim diagnostics (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -la bezel-shim/build/
          otool -L bezel-shim/build/libbezel*.dylib || true

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_TEST_PROGRESS: '1'
          BEZEL_MARSHAL_DEBUG: '1'
        timeout-minutes: 8
        run: raco test bezel-test/

      - name: Generate showcase screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: racket scripts/showcase.rkt docs/showcase.png

      - name: Upload showcase artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ matrix.os }}
          path: docs/showcase.png

  native-package:
    name: Native package (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the Linux release on the oldest supported glibc/libstdc++
          # baseline, then smoke it on both the baseline and current Ubuntu.
          - os: ubuntu-22.04
            asset: bezel-native-linux-x86_64
            archive: bezel-native-linux-x86_64.tar.gz
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            asset: bezel-native-windows-x86_64
            archive: bezel-native-windows-x86_64.zip
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            asset: bezel-native-macosx-aarch64
            archive: bezel-native-macosx-aarch64.tar.gz
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket for package assembly
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Install Qt6 and packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev patchelf
          echo "CMAKE_PREFIX_PATH=/usr" >> $GITHUB_ENV

      - name: Install Qt6 and packaging tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt cmake
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          archives: qtbase
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/package-native-linux.sh bezel-shim/build dist

      - name: Package macOS runtime
        if: runner.os == 'macOS'
        run: bash scripts/package-native-macos.sh bezel-shim/build dist

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native-windows.ps1 -BuildDir bezel-shim/build -DistDir dist

      - name: Build self-contained Racket package
        run: racket scripts/package-racket-runtime.rkt "dist/${{ matrix.asset }}" "${{ matrix.platform }}" dist

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.archive }}
            dist/bezel-lib-${{ matrix.platform }}.zip
            dist/bezel-lib-${{ matrix.platform }}.zip.CHECKSUM
          if-no-files-found: error

  native-smoke:
    name: Clean package smoke (${{ matrix.target }})
    needs: native-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64-ubuntu22
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: ubuntu-24.04
            target: linux-x86_64-ubuntu24
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            target: windows-x86_64
            asset: bezel-native-windows-x86_64
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            target: macosx-aarch64
            asset: bezel-native-macosx-aarch64
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket only
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Install self-contained Bezel package
        run: raco pkg install --auto --no-docs --name bezel-lib "dist/bezel-lib-${{ matrix.platform }}.zip"

      - name: Diagnose package-local runtime
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: raco bezel doctor

      - name: Run packaged runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: racket scripts/native-smoke.rkt

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Link packages
        run: |
          raco pkg install --auto --no-docs --link ./bezel-lib
          raco pkg install --auto --no-docs --link ./bezel-doc

      - name: Build documentation
        run: raco setup bezel-doc

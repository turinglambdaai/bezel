name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Verify version consistency
        run: racket scripts/check-version.rkt

      - name: Regenerate checked-in bindings
        run: racket tools/generator/generate.rkt tools/generator/specs/dial.json

      - name: Verify generated bindings are reproducible
        run: git diff --exit-code -- bezel-shim/src/generated bezel-lib/generated

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        racket-version: ['8.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: ${{ matrix.racket-version }}
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev
          echo "CMAKE_PREFIX_PATH=/usr" >> $GITHUB_ENV

      - name: Install Qt6 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt cmake
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          archives: qtbase
          cache: true

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Link Racket packages
        run: |
          raco pkg install --auto --no-docs --link ./bezel-lib
          raco pkg install --auto --no-docs --link ./bezel-test
          raco pkg install --auto --no-docs --link ./bezel

      - name: Shim diagnostics (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -la bezel-shim/build/
          otool -L bezel-shim/build/libbezel*.dylib || true

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_TEST_PROGRESS: '1'
          BEZEL_MARSHAL_DEBUG: '1'
        timeout-minutes: 8
        run: raco test bezel-test/

      - name: Generate showcase screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: racket scripts/showcase.rkt docs/showcase.png

      - name: Upload showcase artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ matrix.os }}
          path: docs/showcase.png

  native-package:
    name: Native package (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the Linux release on the oldest supported glibc/libstdc++
          # baseline, then smoke it on both the baseline and current Ubuntu.
          - os: ubuntu-22.04
            asset: bezel-native-linux-x86_64
            archive: bezel-native-linux-x86_64.tar.gz
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            asset: bezel-native-windows-x86_64
            archive: bezel-native-windows-x86_64.zip
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            asset: bezel-native-macosx-aarch64
            archive: bezel-native-macosx-aarch64.tar.gz
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket for package assembly
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Install Qt6 and packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev patchelf
          echo "CMAKE_PREFIX_PATH=/usr" >> $GITHUB_ENV

      - name: Install Qt6 and packaging tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt cmake
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          archives: qtbase
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S bezel-shim -B bezel-shim/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure shim (Windows)
        if: runner.os == 'Windows'
        run: cmake -S bezel-shim -B bezel-shim\build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build shim (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build bezel-shim/build -j

      - name: Build shim (Windows)
        if: runner.os == 'Windows'
        run: cmake --build bezel-shim\build --config Release -j

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/package-native-linux.sh bezel-shim/build dist

      - name: Package macOS runtime
        if: runner.os == 'macOS'
        run: bash scripts/package-native-macos.sh bezel-shim/build dist

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native-windows.ps1 -BuildDir bezel-shim/build -DistDir dist

      - name: Build self-contained Racket package
        run: racket scripts/package-racket-runtime.rkt "dist/${{ matrix.asset }}" "${{ matrix.platform }}" dist

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.archive }}
            dist/bezel-lib-${{ matrix.platform }}.zip
            dist/bezel-lib-${{ matrix.platform }}.zip.CHECKSUM
          if-no-files-found: error

  native-smoke:
    name: Clean package smoke (${{ matrix.target }})
    needs: native-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64-ubuntu22
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: ubuntu-24.04
            target: linux-x86_64-ubuntu24
            asset: bezel-native-linux-x86_64
            platform: linux-x86_64
            racket-arch: x64
          - os: windows-latest
            target: windows-x86_64
            asset: bezel-native-windows-x86_64
            platform: windows-x86_64
            racket-arch: x64
          - os: macOS-latest
            target: macosx-aarch64
            asset: bezel-native-macosx-aarch64
            platform: macosx-aarch64
            racket-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket only
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'
          architecture: ${{ matrix.racket-arch }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Install self-contained Bezel package
        run: raco pkg install --auto --no-docs --name bezel-lib "dist/bezel-lib-${{ matrix.platform }}.zip"

      - name: Diagnose package-local runtime
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: raco bezel doctor

      - name: Run packaged runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          BEZEL_REQUIRE_PACKAGED_RUNTIME: '1'
        run: racket scripts/native-smoke.rkt

      - name: Package a demo application
        run: raco bezel package --entry scripts/app-smoke.rkt --name bezel-demo --dest app-dist

      - name: Run the packaged application headlessly
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            exe=./app-dist/bezel-demo/bezel-demo.exe
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            exe=./app-dist/bezel-demo/bezel-demo.app/Contents/MacOS/bin/bezel-demo
          else
            exe=./app-dist/bezel-demo/bin/bezel-demo
          fi
          "$exe"
          code=$?
          echo "packaged app exit code: $code"
          exit $code

      # ---- platform installers + silent self-update ----------------------

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Fetch appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Build the platform installer
        run: raco bezel package --entry scripts/app-smoke.rkt --name bezel-demo --dest app-dist --app-version 1.0.0 --installer

      - name: Verify the installer artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ls -la app-dist/*-setup.exe
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            ls -la app-dist/*.dmg
            hdiutil verify app-dist/*.dmg
          else
            ls -la app-dist/*.AppImage
          fi

      - name: Silent install and run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $installer = (Get-ChildItem app-dist -Filter *-setup.exe).FullName
          Start-Process -Wait -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$PWD\installed"
          & "$PWD\installed\bezel-demo.exe"
          if ($LASTEXITCODE -ne 0) { throw "installed app exited $LASTEXITCODE" }

      - name: Run from the AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x app-dist/*.AppImage
          ./app-dist/*.AppImage --appimage-extract-and-run
          code=$?
          echo "AppImage exit code: $code"
          exit $code

      - name: Mount the dmg and inspect (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach app-dist/*.dmg -mountpoint /Volumes/bezel-demo-test -nobrowse
          ls /Volumes/bezel-demo-test   # dmg root IS the app folder contents
          ls /Volumes/bezel-demo-test/bezel-demo.app
          hdiutil detach /Volumes/bezel-demo-test

      - name: Self-update end to end (v1 -> v2)
        shell: bash
        timeout-minutes: 6
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          raco bezel package --entry scripts/app-smoke.rkt --name bezel-demo --dest app-dist2 --app-version 2.0.0
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXE=app-dist/bezel-demo/bezel-demo.exe
            powershell -Command "Compress-Archive -Path app-dist2/bezel-demo -DestinationPath update.zip -Force"
            export BEZEL_SMOKE_MARKER="$(cygpath -w "$PWD/marker.txt")"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            EXE=app-dist/bezel-demo/bezel-demo.app/Contents/MacOS/bin/bezel-demo
            ditto -c -k --keepParent app-dist2/bezel-demo update.zip
            export BEZEL_SMOKE_MARKER="$PWD/marker.txt"
          else
            EXE=app-dist/bezel-demo/bin/bezel-demo
            (cd app-dist2 && zip -qr ../update.zip bezel-demo)
            export BEZEL_SMOKE_MARKER="$PWD/marker.txt"
          fi
          racket scripts/make-feed.rkt update.zip 2.0.0 > update-feed.json
          cat update-feed.json
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            FEED="$(cygpath -m "$PWD/update-feed.json")"
          else
            FEED="$PWD/update-feed.json"
          fi
          BEZEL_SMOKE_FEED="file:///$FEED" "$EXE" > v1.log 2>&1 || true
          echo "--- v1.log ---"
          cat v1.log
          ok=0
          for i in $(seq 1 60); do
            if [[ -f marker.txt ]]; then ok=1; break; fi
            sleep 1
          done
          echo "marker: $(cat marker.txt 2>/dev/null || echo MISSING)"
          cat app-dist/.bezel-swap.log 2>/dev/null || true
          [[ $ok == 1 && "$(cat marker.txt)" == "2.0.0" ]]

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.12'

      - name: Link packages
        run: |
          raco pkg install --auto --no-docs --link ./bezel-lib
          raco pkg install --auto --no-docs --link ./bezel-doc

      - name: Build documentation
        run: raco setup bezel-doc
